<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B FIT ASSESSMENT CLUB | Professional Evaluation</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff6b00'/%3E%3Cstop offset='1' stop-color='%23ff9900'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='40' font-family='Arial Black,Arial' font-weight='900' font-size='34' text-anchor='middle' fill='white'%3EB%3C/text%3E%3Ctext x='32' y='56' font-family='Arial' font-weight='700' font-size='14' text-anchor='middle' fill='white'%3EFIT%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;900&family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: #131b2e;
            --card-inner: #1e293b;
            --primary-orange: #ff6b00;
            --primary-orange-hover: #e05e00;
            --text-white: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success-green: #10b981;
            --warning-red: #ef4444;
            --accent-gender: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 15px;
            min-height: 100vh;
            background-image: radial-gradient(circle at top right, rgba(255, 107, 0, 0.15), transparent 60%);
        }

        .assessment-container {
            width: 100%;
            max-width: 1050px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            padding: 40px;
            border: 1px solid var(--border-color);
        }

        .brand-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--primary-orange);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .brand-logo-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--primary-orange), #ff9900);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            box-shadow: 0 8px 25px rgba(255, 107, 0, 0.4);
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
        }

        .brand-logo-icon span.b-text { font-size: 26px; line-height: 1; }
        .brand-logo-icon span.fit-text { font-size: 13px; opacity: 0.9; }

        .brand-titles h1 {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
        }

        .brand-titles p {
            font-size: 13px;
            color: var(--primary-orange);
            font-weight: 700;
        }

        .section-header {
            background: var(--card-inner);
            padding: 14px 22px;
            border-radius: 14px;
            margin: 35px 0 20px 0;
            display: flex;
            align-items: center;
            border-right: 6px solid var(--primary-orange);
        }

        .section-header h2 {
            font-size: 18px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 900;
        }

        .form-grid-4 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 18px;
            margin-bottom: 15px;
        }

        .input-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-box label {
            font-size: 13px;
            font-weight: 700;
            color: #e2e8f0;
            display: flex;
            justify-content: space-between;
        }

        .input-box label span.en {
            color: var(--text-muted);
            font-weight: 500;
        }

        .input-box input, .input-box select {
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 14px;
            background: var(--bg-main);
            color: #fff;
            outline: none;
            width: 100%;
        }

        .input-box input:focus, .input-box select:focus {
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 4px rgba(255, 107, 0, 0.15);
        }

        .ocr-status {
            font-size: 13px;
            color: var(--primary-orange);
            margin-top: 5px;
            font-weight: 700;
            display: none;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-orange), var(--primary-orange-hover));
            color: #fff;
            padding: 18px;
            border: none;
            border-radius: 14px;
            font-size: 19px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 35px;
            box-shadow: 0 10px 25px rgba(255, 107, 0, 0.35);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="assessment-container">
    <div class="brand-header">
        <div class="brand-logo">
            <div class="brand-logo-icon">
                <span class="b-text">B</span>
                <span class="fit-text">FIT</span>
            </div>
            <div class="brand-titles">
                <h1>B FIT ASSESSMENT CLUB</h1>
                <p>PHYSICAL PERFORMANCE & BIOLOGICAL AGE ASSESSMENT</p>
            </div>
        </div>
    </div>

    <form id="bfitAssessmentForm" onsubmit="calculateAssessment(event)">
        <div class="section-header">
            <h2><i class="fa-solid fa-id-card"></i> 1. البيانات العامة والإنبودي (Gemini Vision AI)</h2>
        </div>

        <div class="form-grid-4">
            <div class="input-box" style="grid-column: span 2;">
                <label>إرفاق تقرير InBody 770 (تحليل ذكي فوري) <span class="en">Gemini AI</span></label>
                <input type="file" id="inbodyFile" accept="image/*">
                <div id="ocrStatusMsg" class="ocr-status"></div>
            </div>
            <div class="input-box">
                <label>اسم المدرب المختص</label>
                <input type="text" id="coachName" required placeholder="اسم المدرب">
            </div>
            <div class="input-box">
                <label>اسم المشترك</label>
                <input type="text" id="clientName" required placeholder="اسم المشترك">
            </div>
            <div class="input-box">
                <label>الجنس</label>
                <select id="genderSelect" required>
                    <option value="male">ذكر / Male</option>
                    <option value="female">أنثى / Female</option>
                </select>
            </div>
            <div class="input-box">
                <label>العمر الحقيقي</label>
                <input type="number" id="realAge" required min="12" max="90" placeholder="مثال: 23">
            </div>
            <div class="input-box">
                <label>الوزن (كجم)</label>
                <input type="number" id="weightInput" step="0.1" min="30" max="250" required placeholder="مثال: 72.9">
            </div>
            <div class="input-box">
                <label>الطول (سم)</label>
                <input type="number" id="heightInput" step="0.1" min="100" max="230" required placeholder="مثال: 171">
            </div>
            <div class="input-box">
                <label>نسبة الدهون PBF (%)</label>
                <input type="number" id="fatInput" step="0.1" min="3" max="60" required placeholder="مثال: 14.4">
            </div>
            <div class="input-box">
                <label>كتلة العضلات SMM (كجم)</label>
                <input type="number" id="smmInput" step="0.1" min="10" max="80" required placeholder="مثال: 34.9">
            </div>
        </div>

        <button type="submit" class="btn-submit">
            <i class="fa-solid fa-calculator"></i> استخراج التقرير الشامل والعمر البيولوجي
        </button>
    </form>
</div>

<script>
    function setOcrStatus(color, iconClass, message) {
        const el = document.getElementById('ocrStatusMsg');
        el.style.display = 'block';
        el.style.color = color;
        el.innerHTML = '<i class="' + iconClass + '"></i> ' + message;
    }

    document.addEventListener('DOMContentLoaded', () => {
        const fileInput = document.getElementById('inbodyFile');
        if (fileInput) {
            fileInput.addEventListener('change', async function(event) {
                const file = event.target.files[0];
                if (!file) return;

                setOcrStatus('#ff6b00', 'fa-solid fa-spinner fa-spin', 'جاري تحليل تقرير InBody الذكي عبر نموذج Gemini...');

                try {
                    const base64Data = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            const img = new Image();
                            img.onload = function() {
                                const canvas = document.createElement('canvas');
                                const MAX_DIM = 800;
                                let w = img.width;
                                let h = img.height;
                                if (w > MAX_DIM || h > MAX_DIM) {
                                    if (w > h) { h = Math.round((h * MAX_DIM) / w); w = MAX_DIM; }
                                    else { w = Math.round((w * MAX_DIM) / h); h = MAX_DIM; }
                                }
                                canvas.width = w;
                                canvas.height = h;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0, w, h);
                                resolve(canvas.toDataURL('image/jpeg', 0.8).split(',')[1]);
                            };
                            img.onerror = reject;
                            img.src = e.target.result;
                        };
                        reader.onerror = reject;
                        reader.readAsDataURL(file);
                    });

                    // مفتاح وربط نموذج Gemini المباشر
                    const apiKey = "AQ.Ab8RN6Iq9pYQL5V-Jy_6fMHdFmViEW_V_VvqnvW1mdoBfn6erw";
                    const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + apiKey;

                    const payload = {
                        "contents": [{
                            "parts": [
                                {"text": "Analyze this InBody 770 report image. Extract and return ONLY a valid JSON object with these exact keys and nothing else: age (number), weight (number in kg), height (number in cm), smm (number in kg), pbf (number percentage), gender ('male' or 'female'). No markdown formatting or backticks."},
                                {
                                    "inline_data": {
                                        "mime_type": "image/jpeg",
                                        "data": base64Data
                                    }
                                }
                            ]
                        }]
                    };

                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const resJson = await response.json();
                    
                    if (resJson.error) {
                        throw new Error(resJson.error.message || JSON.stringify(resJson.error));
                    }

                    const rawText = resJson.candidates[0].content.parts[0].text;
                    const cleaned = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
                    const result = JSON.parse(cleaned);

                    if (result.age) document.getElementById('realAge').value = result.age;
                    if (result.weight) document.getElementById('weightInput').value = result.weight;
                    if (result.height) document.getElementById('heightInput').value = result.height;
                    if (result.smm) document.getElementById('smmInput').value = result.smm;
                    if (result.pbf) document.getElementById('fatInput').value = result.pbf;
                    if (result.gender) {
                        const g = String(result.gender).toLowerCase();
                        document.getElementById('genderSelect').value = (g.includes('fem') || g.includes('أنثى')) ? 'female' : 'male';
                    }

                    setOcrStatus('#10b981', 'fa-solid fa-circle-check', 'تم استخراج بيانات InBody بنجاح تام وبدون أخطاء!');

                } catch (err) {
                    console.error("Gemini Direct Error:", err);
                    setOcrStatus('#ef4444', 'fa-solid fa-circle-xmark', 'خطأ في الاتصال: ' + err.message);
                }
            });
        }
    });

    function calculateAssessment(e) {
        e.preventDefault();
        alert('تم حفظ البيانات وجاهزة لإصدار التقرير يا كوتش!');
    }
</script>

</body>
</html>
