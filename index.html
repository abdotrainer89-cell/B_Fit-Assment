<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B FIT ASSESSMENT CLUB</title>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;900&family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tesseract.js for High-Precision OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        :root {
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --card-inner: #334155;
            --primary-orange: #ff6b00;
            --primary-orange-hover: #e05e00;
            --text-white: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #475569;
            --success-green: #10b981;
            --warning-red: #ef4444;
            --accent-gender: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', 'Montserrat', sans-serif;
            transition: all 0.25s ease;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            min-height: 100vh;
            background-image: radial-gradient(circle at top right, rgba(255, 107, 0, 0.12), transparent 50%);
        }

        .assessment-container {
            width: 100%;
            max-width: 1050px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            padding: 40px;
            border: 1px solid var(--border-color);
        }

        /* Brand Header */
        .brand-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--primary-orange);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .brand-logo-icon {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, var(--primary-orange), #ff8800);
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 32px;
            box-shadow: 0 8px 25px rgba(255, 107, 0, 0.4);
        }

        .brand-titles h1 {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 1px;
        }

        .brand-titles p {
            font-size: 14px;
            color: var(--primary-orange);
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
        }

        /* Section Title */
        .section-header {
            background: var(--card-inner);
            padding: 14px 22px;
            border-radius: 14px;
            margin: 35px 0 20px 0;
            display: flex;
            align-items: center;
            border-right: 6px solid var(--primary-orange);
        }

        .section-header h2 {
            font-size: 18px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 900;
        }

        /* Form Grid */
        .form-grid-4 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 18px;
            margin-bottom: 15px;
        }

        .input-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-box label {
            font-size: 13px;
            font-weight: 700;
            color: #e2e8f0;
            display: flex;
            justify-content: space-between;
        }

        .input-box label span.en {
            font-family: 'Montserrat', sans-serif;
            color: var(--text-muted);
            font-weight: 500;
        }

        .input-box input, .input-box select {
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 14px;
            background: var(--bg-main);
            color: #fff;
            outline: none;
        }

        .input-box input:focus, .input-box select:focus {
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 4px rgba(255, 107, 0, 0.15);
        }

        .ocr-status {
            font-size: 13px;
            color: var(--primary-orange);
            margin-top: 5px;
            font-weight: 700;
            display: none;
            direction: ltr;
            text-align: right;
        }

        /* Health Questions */
        .health-question-row {
            display: grid;
            grid-template-columns: 1fr 140px 1fr;
            align-items: center;
            background: var(--card-inner);
            border: 1px solid var(--border-color);
            padding: 14px 20px;
            border-radius: 12px;
            margin-bottom: 10px;
            gap: 15px;
        }

        .q-ar {
