    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: #131b2e;
            --card-inner: #1e293b;
            --primary-orange: #ff6b00;
            --primary-orange-hover: #e05e00;
            --text-white: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success-green: #10b981;
            --warning-red: #ef4444;
            --accent-gender: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', 'Montserrat', sans-serif;
        }

        input, select, button, label, .exercise-avatar-box {
            transition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, color 0.25s ease, transform 0.25s ease;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 15px;
            min-height: 100vh;
            background-image: radial-gradient(circle at top right, rgba(255, 107, 0, 0.15), transparent 60%);
        }

        .assessment-container {
            width: 100%;
            max-width: 1050px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            padding: 40px;
            border: 1px solid var(--border-color);
        }

        .brand-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--primary-orange);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .brand-logo-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--primary-orange), #ff9900);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            box-shadow: 0 8px 25px rgba(255, 107, 0, 0.4);
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        .brand-logo-icon span { font-family: 'Montserrat', sans-serif; }
        .brand-logo-icon span.b-text { font-size: 26px; line-height: 1; }
        .brand-logo-icon span.fit-text { font-size: 13px; opacity: 0.9; }

        .brand-titles h1 {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 1px;
            font-family: 'Montserrat', 'Tajawal', sans-serif;
        }

        .brand-titles p {
            font-size: 13px;
            color: var(--primary-orange);
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 0.5px;
        }

        .section-header {
            background: var(--card-inner);
            padding: 14px 22px;
            border-radius: 14px;
            margin: 35px 0 20px 0;
            display: flex;
            align-items: center;
            border-right: 6px solid var(--primary-orange);
        }

        .section-header h2 {
            font-size: 18px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 900;
        }

        .form-grid-4 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 18px;
            margin-bottom: 15px;
        }

        .input-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-box label {
            font-size: 13px;
            font-weight: 700;
            color: #e2e8f0;
            display: flex;
            justify-content: space-between;
            gap: 6px;
        }

        .input-box label span.en {
            font-family: 'Montserrat', sans-serif;
            color: var(--text-muted);
            font-weight: 500;
        }

        .input-box input, .input-box select {
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 14px;
            background: var(--bg-main);
            color: #fff;
            outline: none;
            width: 100%;
        }

        .input-box input:focus, .input-box select:focus {
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 4px rgba(255, 107, 0, 0.15);
        }

        .ocr-status {
            font-size: 13px;
            color: var(--primary-orange);
            margin-top: 5px;
            font-weight: 700;
            display: none;
            line-height: 1.7;
        }

        .health-question-row {
            display: grid;
            grid-template-columns: 1fr 140px 1fr;
            align-items: center;
            background: var(--card-inner);
            border: 1px solid var(--border-color);
            padding: 14px 20px;
            border-radius: 12px;
            margin-bottom: 10px;
            gap: 15px;
        }

        .q-ar { text-align: right; font-size: 14px; font-weight: 700; color: #fff; }
        .q-en { text-align: left; font-size: 13px; font-family: 'Montserrat', sans-serif; font-weight: 600; color: var(--text-muted); direction: ltr; }

        .radio-btn-group {
            display: flex;
            background: var(--bg-main);
            border-radius: 8px;
            padding: 3px;
        }

        .radio-btn-group input[type="radio"] { display: none; }
        .radio-btn-group label {
            flex: 1; text-align: center; padding: 6px 8px; font-size: 12px; font-weight: 700; cursor: pointer; border-radius: 6px; color: var(--text-muted);
        }

        .radio-btn-group input[type="radio"]:checked + label.yes-label { background: var(--warning-red); color: #fff; }
        .radio-btn-group input[type="radio"]:checked + label.no-label { background: var(--success-green); color: #fff; }

        .exercise-card {
            background: var(--card-inner);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 130px 1fr;
            gap: 22px;
            align-items: center;
        }

        .exercise-avatar-box {
            width: 130px;
            height: 105px;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.98), rgba(30, 41, 59, 0.98));
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid var(--accent-gender);
            color: var(--accent-gender);
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .exercise-avatar-box i {
            font-size: 38px;
            margin-bottom: 6px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .exercise-avatar-box .gender-badge {
            font-size: 10px;
            background: var(--accent-gender);
            color: #0f172a;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 900;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
        }

        .exercise-details h4 {
            color: #fff;
            font-size: 16px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .exercise-details p.sub-en {
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 12px;
            direction: ltr;
            text-align: right;
        }

        .exercise-details h4 span.target-tag {
            font-size: 12px;
            background: rgba(255, 107, 0, 0.2);
            color: var(--primary-orange);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 700;
            border: 1px solid rgba(255, 107, 0, 0.4);
            font-family: 'Montserrat', sans-serif;
            direction: ltr;
        }

        .exercise-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-orange), var(--primary-orange-hover));
            color: #fff;
            padding: 18px;
            border: none;
            border-radius: 14px;
            font-size: 19px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 35px;
            box-shadow: 0 10px 25px rgba(255, 107, 0, 0.35);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

            transform: translateY(-2px);
            box-shadow: 0 14px 30
