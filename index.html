<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B FIT ASSESSMENT CLUB</title>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;900&family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Free Client-Side OCR Library (Tesseract.js) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        :root {
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --card-inner: #334155;
            --primary-orange: #ff6b00;
            --primary-orange-hover: #e05e00;
            --text-white: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #475569;
            --success-green: #10b981;
            --warning-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', 'Montserrat', sans-serif;
            transition: all 0.25s ease;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            min-height: 100vh;
            background-image: radial-gradient(circle at top right, rgba(255, 107, 0, 0.12), transparent 50%);
        }

        .assessment-container {
            width: 100%;
            max-width: 1050px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            padding: 40px;
            border: 1px solid var(--border-color);
        }

        /* Brand Header */
        .brand-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--primary-orange);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .brand-logo-icon {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, var(--primary-orange), #ff8800);
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 32px;
            box-shadow: 0 8px 25px rgba(255, 107, 0, 0.4);
        }

        .brand-titles h1 {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 1px;
        }

        .brand-titles p {
            font-size: 14px;
            color: var(--primary-orange);
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
        }

        /* Section Title */
        .section-header {
            background: var(--card-inner);
            padding: 14px 22px;
            border-radius: 14px;
            margin: 35px 0 20px 0;
            display: flex;
            align-items: center;
            border-right: 6px solid var(--primary-orange);
        }

        .section-header h2 {
            font-size: 18px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 900;
        }

        /* Form Grid */
        .form-grid-4 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 18px;
            margin-bottom: 15px;
        }

        .input-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-box label {
            font-size: 13px;
            font-weight: 700;
            color: #e2e8f0;
            display: flex;
            justify-content: space-between;
        }

        .input-box label span.en {
            font-family: 'Montserrat', sans-serif;
            color: var(--text-muted);
            font-weight: 500;
        }

        .input-box input, .input-box select {
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 14px;
            background: var(--bg-main);
            color: #fff;
            outline: none;
        }

        .input-box input:focus, .input-box select:focus {
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 4px rgba(255, 107, 0, 0.15);
        }

        .ocr-status {
            font-size: 13px;
            color: var(--primary-orange);
            margin-top: 5px;
            font-weight: 700;
            display: none;
        }

        /* Health Questions */
        .health-question-row {
            display: grid;
            grid-template-columns: 1fr 140px 1fr;
            align-items: center;
            background: var(--card-inner);
            border: 1px solid var(--border-color);
            padding: 14px 20px;
            border-radius: 12px;
            margin-bottom: 10px;
            gap: 15px;
        }

        .q-ar { text-align: right; font-size: 14px; font-weight: 700; color: #fff; }
        .q-en { text-align: left; font-size: 13px; font-family: 'Montserrat', sans-serif; font-weight: 600; color: var(--text-muted); direction: ltr; }

        .radio-btn-group {
            display: flex;
            background: var(--bg-main);
            border-radius: 8px;
            padding: 3px;
        }

        .radio-btn-group input[type="radio"] { display: none; }
        .radio-btn-group label {
            flex: 1; text-align: center; padding: 6px 8px; font-size: 12px; font-weight: 700; cursor: pointer; border-radius: 6px; color: var(--text-muted);
        }

        .radio-btn-group input[type="radio"]:checked + label.yes-label { background: var(--warning-red); color: #fff; }
        .radio-btn-group input[type="radio"]:checked + label.no-label { background: var(--success-green); color: #fff; }

        /* Exercise Card Layout with Premium Fitness Icons */
        .exercise-card {
            background: var(--card-inner);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 110px 1fr;
            gap: 22px;
            align-items: center;
        }

        .exercise-icon-badge {
            width: 110px;
            height: 100px;
            background: linear-gradient(135deg, rgba(255, 107, 0, 0.15), rgba(15, 23, 42, 0.8));
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid var(--primary-orange);
            color: var(--primary-orange);
            font-size: 36px;
            box-shadow: inset 0 0 15px rgba(255, 107, 0, 0.1);
        }

        .exercise-icon-badge span {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 6px;
            font-weight: 800;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 0.5px;
        }

        .exercise-details h4 {
            color: #fff;
            font-size: 16px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .exercise-details p.sub-en {
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 12px;
            direction: ltr;
            text-align: right;
        }

        .exercise-details h4 span.target-tag {
            font-size: 12px;
            background: rgba(255, 107, 0, 0.2);
            color: var(--primary-orange);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 700;
            border: 1px solid rgba(255, 107, 0, 0.4);
            font-family: 'Montserrat', sans-serif;
        }

        .exercise-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-orange), var(--primary-orange-hover));
            color: #fff;
            padding: 18px;
            border: none;
            border-radius: 14px;
            font-size: 19px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 35px;
            box-shadow: 0 10px 25px rgba(255, 107, 0, 0.35);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(255, 107, 0, 0.45);
        }

        /* Results Display */
        .result-container {
            display: none;
            margin-top: 45px;
            border-top: 2px dashed var(--border-color);
            padding-top: 35px;
        }

        .result-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #fff;
            border-radius: 20px;
            padding: 35px;
            text-align: center;
            border: 1px solid var(--primary-orange);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        .score-display-box {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 25px 0;
        }

        .score-metric-card {
            background: rgba(255, 255, 255, 0.04);
            padding: 20px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .score-metric-card .label { font-size: 13px; color: #94a3b8; margin-bottom: 5px; }
        .score-metric-card .value { font-size: 34px; font-weight: 900; color: #fff; }
        .score-metric-card .value span { color: var(--primary-orange); }

        .bio-age-highlight {
            font-size: 18px;
            font-weight: 700;
            padding: 12px 22px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 10px;
        }

        .bio-younger { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
        .bio-older { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
        .bio-equal { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }

        .report-summary-text {
            font-size: 15px;
            line-height: 1.8;
            color: #cbd5e1;
            margin-top: 25px;
            text-align: right;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 12px;
            border-right: 4px solid var(--primary-orange);
        }

        @media (max-width: 768px) {
            .exercise-card { grid-template-columns: 1fr; justify-items: center; text-align: center; }
            .exercise-icon-badge { width: 100%; height: 75px; flex-direction: row; gap: 10px; }
